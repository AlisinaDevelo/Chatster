name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHATSTER_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend
      - run: go mod download
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Summarize Go coverage
        run: go tool cover -func=coverage.out | tee coverage-summary.txt
      - run: go vet ./...
      - name: Run WebSocket load smoke
        shell: bash
        run: |
          set -euo pipefail

          export CHATSTER_HTTP_ADDR=127.0.0.1:18080
          export CHATSTER_DB_PATH="${RUNNER_TEMP}/chatster-ci-smoke.db"
          export CHATSTER_WS_UPGRADE_RPS=0
          export CHATSTER_MESSAGE_RPS=0

          go run . > server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl -fsS "http://${CHATSTER_HTTP_ADDR}/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS "http://${CHATSTER_HTTP_ADDR}/health" >/dev/null

          go run ./cmd/wsload \
            -url "ws://${CHATSTER_HTTP_ADDR}/ws?room=general" \
            -clients 4 \
            -messages 3 \
            -settle-for 250ms \
            -send-interval 10ms \
            -drain-for 1s \
            -fail-on-loss \
            > wsload-smoke.json

          kill "${server_pid}" 2>/dev/null || true
          trap - EXIT
      - uses: actions/upload-artifact@v7
        with:
          name: backend-runtime-proof
          path: |
            backend/coverage.out
            backend/coverage-summary.txt
            backend/wsload-smoke.json
            backend/server-smoke.log
            if-no-files-found: error

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chatster
          POSTGRES_PASSWORD: chatster
          POSTGRES_DB: chatster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatster -d chatster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: Run Postgres repository contract
        env:
          CHATSTER_POSTGRES_TEST_DSN: postgres://chatster:chatster@127.0.0.1:5432/chatster?sslmode=disable
        run: go test -race -coverprofile=postgres-coverage.out ./db -run '^(TestRepositoryContractPostgres|TestPostgres)'
      - name: Summarize Postgres coverage
        run: go tool cover -func=postgres-coverage.out | tee postgres-coverage-summary.txt
      - uses: actions/upload-artifact@v7
        with:
          name: postgres-repository-proof
          path: |
            backend/postgres-coverage.out
            backend/postgres-coverage-summary.txt
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
      - name: Upload Playwright browser proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-proof
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  production-image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Render Blueprint YAML
        run: ruby -e 'require "yaml"; YAML.load_file("render.yaml")'
      - name: Build production image
        run: docker build -t chatster:ci .
      - name: Smoke production image
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --rm \
            --name chatster-prod-smoke \
            -p 18081:8080 \
            -e CHATSTER_ALLOWED_ORIGINS=http://127.0.0.1:18081 \
            chatster:ci

          trap 'docker logs chatster-prod-smoke || true; docker stop chatster-prod-smoke >/dev/null 2>&1 || true' EXIT

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18081/health
          grep -Fq "Chatster" <<<"$(curl -fsS http://127.0.0.1:18081/)"
          grep -Fq "Chatster" <<<"$(curl -fsS http://127.0.0.1:18081/rooms/general)"
          grep -Fq "Chatster" <<<"$(curl -fsS http://127.0.0.1:18081/rooms/engineering)"
          grep -Fq '"messages":[]' <<<"$(curl -fsS "http://127.0.0.1:18081/api/messages?limit=1&room=engineering")"
          grep -Fq "chatster_" <<<"$(curl -fsS http://127.0.0.1:18081/metrics)"

          docker stop chatster-prod-smoke
          trap - EXIT
